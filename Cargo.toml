[package]
name = "liteview"
version = "1.4.0"
edition = "2024"
rust-version = "1.95"
description = "LiteView 轻量看图：看图、编辑、打码"
license = "MIT"
repository = "https://github.com/Lianzy-Baimiao/LiteView"
build = "build.rs"

[[bin]]
name = "LiteView"
path = "src/main.rs"

[dependencies]
egui = "=0.36.2"
# 与 epaint 用同一个版本，启动时预检系统字体（不新增依赖）
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gif = "=0.14.2"
color_quant = "=1.1.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
log = "=0.4.34"
memmap2 = "=0.9.11"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
rfd = "=0.17.2"
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
sys-locale = "=0.3.2"
raw-window-handle = "=0.6.2"
kamadak-exif = "=0.6.1"
jxl-oxide = "=0.12.6"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
notify = "=8.2.0"
webp = { version = "=0.3.1", default-features = false }

# Windows 上自己画（winit + Direct3D 11，见 src/app/host.rs、src/platform/d3d11.rs）；其它系统仍用 eframe + wgpu
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
pollster = "=0.4.0"

[target.'cfg(windows)'.dependencies]
egui-winit = { version = "=0.36.2", default-features = false, features = ["accesskit", "clipboard"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dev-dependencies.windows]
version = "=0.62.2"
# examples/compile_shaders.rs（运行时不依赖 d3dcompiler）；打印测试用系统的 PDF 渲染核对输出
features = ["Win32_Graphics_Direct3D_Fxc", "Data_Pdf", "Storage", "Storage_Streams"]

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Storage_Search",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Printing",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "=3.0.12"
