name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows support report privacy fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/test_windows_support.ps1
          ./packaging/test_windows_probe_result.ps1
      - name: Windows support report privacy fixtures (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./packaging/test_windows_support.ps1
          ./packaging/test_windows_probe_result.ps1
      - name: Installer process regression (PowerShell 7)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_installer_process.ps1
      - name: Installer process regression (Windows PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: ./packaging/test_installer_process.ps1
      - name: MSIX activation process regression (PowerShell 7)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_msix_process.ps1
      - name: MSIX activation process regression (Windows PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: ./packaging/test_msix_process.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release --lib
      - name: Build
        run: cargo build --locked --release
      - name: Windows executable resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test_windows_resources.ps1 -Binary target/release/LiteView.exe
      - name: Windows startup validation dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r packaging/requirements-windows-validation.txt
      - name: Windows real startup and missing-runtime controls
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        env:
          LITEVIEW_TEST_BINARY: target/release/LiteView.exe
          LITEVIEW_TEST_OUTPUT: ${{ runner.temp }}/liteview-startup
          LITEVIEW_CORPUS_BINARY: target/release/LiteView.exe
          LITEVIEW_CORPUS_OUTPUT: ${{ runner.temp }}/liteview-corpus
        run: python -m unittest discover -s packaging -p "test_windows_*.py" -v
      - name: Windows startup evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-evidence
          path: |
            ${{ runner.temp }}/liteview-startup/**/*.json
            ${{ runner.temp }}/liteview-startup/**/*.log
            ${{ runner.temp }}/liteview-startup/**/frame.png
            ${{ runner.temp }}/liteview-corpus/**/*.json
            ${{ runner.temp }}/liteview-corpus/**/*.log
            ${{ runner.temp }}/liteview-corpus/**/frame.png
          if-no-files-found: ignore
