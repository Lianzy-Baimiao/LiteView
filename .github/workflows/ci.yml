name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer process regression (PowerShell 7)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_installer_process.ps1
      - name: Installer process regression (Windows PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: ./packaging/test_installer_process.ps1
      - name: MSIX activation process regression (PowerShell 7)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_msix_process.ps1
      - name: MSIX activation process regression (Windows PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: ./packaging/test_msix_process.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release --lib
      - name: Build
        run: cargo build --locked --release
      - name: Windows executable resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test_windows_resources.ps1 -Binary target/release/LiteView.exe
