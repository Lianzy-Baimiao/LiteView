name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "LiteView-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/LiteView.exe $name/
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md $name/
          # 绿色版：配置存在程序旁的 config 目录
          New-Item -ItemType File -Path "$name/LiteView.portable" | Out-Null
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "LiteView-${{ github.ref_name }}-windows-x64.zip" --title "${{ github.ref_name }}" --notes-file docs/release-notes.md
