name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['package']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'tag and manifest version differ'"
      - run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - run: cargo about generate --locked -o LICENSES.html packaging/licenses.hbs
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: LICENSES.html

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            binary: target/release/LiteView.exe
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            binary: target/release/LiteView
          - os: macos-15
            platform: macos
            arch: arm64
            binary: target/release/LiteView
          - os: macos-15-intel
            platform: macos
            arch: x64
            binary: target/release/LiteView
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows process-tree regression
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_installer_process.ps1
      - name: Windows MSIX activation process regression
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: ./packaging/test_msix_process.ps1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release --lib
      - run: cargo build --locked --release
      - name: Windows executable resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test_windows_resources.ps1 -Binary target/release/LiteView.exe
      - uses: actions/download-artifact@v4
        with:
          name: licenses
      - name: Packaging tests
        run: python -m unittest discover -s packaging -p "test_*.py"
      - name: Portable archive / app bundle
        run: python packaging/package.py --binary ${{ matrix.binary }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on the Windows runner' }
          & $compiler.FullName "/DAppVersion=$version" "/DBinaryDir=$pwd/target/release" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = Join-Path $env:RUNNER_TEMP 'liteview-previous-installer'
          New-Item -ItemType Directory -Path $previous -Force | Out-Null
          & $compiler.FullName "/DAppVersion=0.0.0" "/DBinaryDir=$pwd/target/release" "/O$previous" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows installer lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          $previous = Join-Path $env:RUNNER_TEMP 'liteview-previous-installer'
          ./packaging/test_windows_installer.ps1 -Installer "dist/LiteView-v$version-windows-x64-setup.exe" -PreviousInstaller "$previous/LiteView-v0.0.0-windows-x64-setup.exe" -Binary "target/release/LiteView.exe" -Version $version
      - name: Windows Store MSIX build and isolated lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'].split('-')[0])"
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK MakeAppx is required' }
          python packaging/msix.py --binary target/release/LiteView.exe --store-version "$version.0" --makeappx $sdk.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/test_msix_lifecycle.ps1 -Package "dist/store/LiteView-store-$version.0-x64.msix" -Binary target/release/LiteView.exe -MakeAppx $sdk.FullName -SignTool (Join-Path $sdk.DirectoryName 'signtool.exe')
      - name: Store submission candidate (not a public download)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Store-submission-x64
          path: |
            dist/store/*.msix
            dist/store/*.json
          if-no-files-found: error
      - name: Installer smoke test logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-logs
          path: ${{ runner.temp }}/liteview-installer-smoke/*.log
          if-no-files-found: ignore
      - name: MSIX lifecycle reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-test-reports
          path: |
            ${{ runner.temp }}/liteview-msix-*/installed.json
            ${{ runner.temp }}/liteview-msix-*/upgraded.json
          if-no-files-found: ignore
      - name: Unsigned Windows validation inputs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-inputs
          path: |
            target/release/LiteView.exe
            dist/store/*.msix
            dist/store/*.json
            LICENSES.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: LiteView-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LiteView-*
          path: release
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt)
          release_args=(--verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md)
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release/* "${release_args[@]}"
