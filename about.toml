# Distribution targets; include build dependencies for conservative attribution.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0", "OFL-1.1"]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# epaint embeds unmodified Ubuntu-Light.ttf; preserve its UFL alongside OFL/MIT notices.
[epaint_default_fonts]
accepted = ["Ubuntu-font-1.0"]
